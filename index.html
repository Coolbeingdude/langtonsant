<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Infinite Multi-Color Langton's Ant</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            background: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            gap: 12px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            align-items: center;
            background: #2a2a2a;
            padding: 12px 18px;
            border-radius: 8px;
            max-width: 1040px;
        }

        .workspace {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 16px;
        }

        .canvas-wrapper {
            position: relative;
            width: 620px;
            height: 620px;
        }

        .hud {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid #444;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
            color: #ddd;
        }

        .ant-panel {
            background: #2a2a2a;
            padding: 14px;
            border-radius: 8px;
            width: 390px;
            max-height: 620px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ant-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
        }

        .ant-card {
            background: #222;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
        }

        .ant-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .ant-row input {
            width: 56px;
            padding: 4px 6px;
        }

        .ant-row select {
            padding: 4px 6px;
        }

        label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }

        input[type="number"],
        input[type="text"],
        select,
        button {
            padding: 6px 10px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #333;
            color: #fff;
        }

        input:disabled,
        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        button {
            cursor: pointer;
            background: #007acc;
            border: none;
            font-weight: 600;
        }

        button:hover:not(:disabled) {
            background: #005fa3;
        }

        button.secondary {
            background: #444;
        }

        button.secondary:hover:not(:disabled) {
            background: #555;
        }

        button.danger {
            background: #a83232;
            padding: 4px 8px;
            font-size: 12px;
        }

        button.danger:hover {
            background: #872424;
        }

        .step-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #222;
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid #444;
        }

        canvas {
            border: 2px solid #444;
            width: 620px;
            height: 620px;
            background: #ffffff;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>
    <h2>Infinite Multi-Color Langton's Ant</h2>

    <div class="controls">
        <label>
            Colors:
            <input type="number" id="colorCount" min="2" max="24" value="4" style="width: 50px;" />
        </label>

        <label>
            Rule (R/L/S/U):
            <input type="text" id="ruleInput" value="RLRR" style="width: 110px; text-transform: uppercase;" />
        </label>

        <label>
            Speed:
            <input type="range" id="speedSlider" min="1" max="5000" value="100" />
            <select id="speedMult">
                <option value="1">1x</option>
                <option value="10">10x</option>
                <option value="50">50x</option>
            </select>
            <span id="speedValue" style="width: 55px;">100</span>
        </label>

        <button id="pauseBtn" class="secondary">Pause</button>
        <button id="resetBtn">Reset Grid</button>
        <button id="centerCamBtn" class="secondary">Center (0,0)</button>

        <label>
            <input type="checkbox" id="gridLinesToggle" checked />
            Grid Lines
        </label>

        <div class="step-controls">
            <label>
                Step:
                <input type="number" id="stepInput" min="0" value="0" style="width: 90px;" disabled />
            </label>
            <button id="backTenBtn" class="secondary" disabled>-10</button>
            <button id="prevStepBtn" class="secondary" disabled>-1</button>
            <button id="nextStepBtn" class="secondary" disabled>+1</button>
            <button id="fwdTenBtn" class="secondary" disabled>+10</button>
            <button id="goStepBtn" disabled>Go</button>
        </div>
    </div>

    <div class="workspace">
        <div class="canvas-wrapper">
            <canvas id="canvas" width="620" height="620"></canvas>
            <div class="hud" id="hudText">Scroll: Zoom | Drag: Pan | Click: Place Ant</div>
        </div>

        <div class="ant-panel">
            <div class="ant-panel-header">
                <strong>Ants (Click grid to place)</strong>
                <div style="display: flex; gap: 6px;">
                    <button id="addAntBtn">+ Add</button>
                    <button id="clearAntsBtn" class="secondary">Clear</button>
                </div>
            </div>
            <div id="antList"></div>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
