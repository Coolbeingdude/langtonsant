<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Dynamic Multi-Color Langton's Ant</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            gap: 12px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            align-items: center;
            background: #2a2a2a;
            padding: 12px 18px;
            border-radius: 8px;
            max-width: 860px;
        }

        label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }

        input[type="number"],
        input[type="text"],
        select,
        button {
            padding: 6px 10px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #333;
            color: #fff;
        }

        input:disabled,
        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        button {
            cursor: pointer;
            background: #007acc;
            border: none;
            font-weight: 600;
        }

        button:hover:not(:disabled) {
            background: #005fa3;
        }

        button.secondary {
            background: #444;
        }

        button.secondary:hover:not(:disabled) {
            background: #555;
        }

        .step-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #222;
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid #444;
        }

        canvas {
            border: 2px solid #444;
            width: 600px;
            height: 600px;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <h2>Multi-Color Langton's Ant</h2>

    <div class="controls">
        <label>
            Colors:
            <input type="number" id="colorCount" min="2" max="24" value="4" style="width: 50px;" />
        </label>

        <label>
            Rule (R/L/S/U):
            <input type="text" id="ruleInput" value="RLRR" style="width: 115px; text-transform: uppercase;" />
        </label>

        <label>
            Ants:
            <input type="number" id="antCount" min="1" max="50" value="2" style="width: 50px;" />
        </label>

        <label>
            Speed:
            <input type="range" id="speedSlider" min="1" max="5000" value="100" />
            <select id="speedMult">
                <option value="1">1x</option>
                <option value="10">10x</option>
                <option value="50">50x</option>
            </select>
            <span id="speedValue" style="width: 58px;">100</span>
        </label>

        <button id="pauseBtn" class="secondary">Pause</button>
        <button id="applyBtn">Apply & Reset</button>

        <div class="step-controls">
            <label>
                Step / Tick:
                <input type="number" id="stepInput" min="0" value="0" style="width: 100px;" disabled />
            </label>
            <button id="backTenBtn" class="secondary" disabled>-10</button>
            <button id="prevStepBtn" class="secondary" disabled>-1</button>
            <button id="nextStepBtn" class="secondary" disabled>+1</button>
            <button id="fwdTenBtn" class="secondary" disabled>+10</button>
            <button id="goStepBtn" disabled>Go</button>
        </div>
    </div>

    <canvas id="canvas"></canvas>
    <script type="module" src="./main.js"></script>
</body>
</html>
